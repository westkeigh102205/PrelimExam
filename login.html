<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f5f4ef">
	<title>Sign in | Fieldnote</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
	<style>
		:root {
			color-scheme: light;
			--ink: #202b26;
			--muted: #747b73;
			--paper: #f5f4ef;
			--white: #fffefa;
			--green: #264c3e;
			--line: #dedfd7;
			--coral: #db765d;
			font-family: "DM Sans", sans-serif;
			font-synthesis: none;
			text-rendering: optimizeLegibility;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
		}

		* { box-sizing: border-box; }

		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 36px;
			background-color: var(--paper);
			background-image: radial-gradient(#43534812 0.7px, transparent 0.7px);
			background-size: 8px 8px;
			color: var(--ink);
		}

		.login-shell {
			display: grid;
			grid-template-columns: minmax(340px, 0.92fr) minmax(390px, 1.08fr);
			width: min(100%, 1040px);
			min-height: 640px;
			overflow: hidden;
			background: var(--white);
			border: 1px solid #e6e5dc;
			border-radius: 6px;
			box-shadow: 0 22px 70px #26332912;
			animation: arrive 550ms ease-out both;
		}

		.story {
			position: relative;
			isolation: isolate;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			min-height: 640px;
			padding: 34px 38px;
			overflow: hidden;
			background: #344e40;
			color: #fffdf5;
		}

		.story::before {
			position: absolute;
			z-index: -2;
			inset: 0;
			background: url("https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1200&q=85") center / cover;
			content: "";
		}

		.story::after {
			position: absolute;
			z-index: -1;
			inset: 0;
			background: linear-gradient(180deg, #18271c55 0%, #18271c0d 34%, #18271ce8 100%);
			content: "";
		}

		.brand {
			display: inline-flex;
			align-items: center;
			gap: 11px;
			width: fit-content;
			color: inherit;
			font-size: 17px;
			font-weight: 700;
			letter-spacing: 0;
			text-decoration: none;
		}

		.brand-mark {
			display: grid;
			width: 32px;
			aspect-ratio: 1;
			place-items: center;
			border: 1px solid #ffffffa3;
			border-radius: 50%;
			color: #fff;
			font-family: "Playfair Display", Georgia, serif;
			font-size: 20px;
			font-weight: 500;
		}

		.story-copy { max-width: 360px; padding-bottom: 12px; }

		.eyebrow {
			margin: 0 0 16px;
			color: #f2c6a8;
			font-size: 11px;
			font-weight: 700;
			letter-spacing: 1.5px;
			text-transform: uppercase;
		}

		.story h1 {
			max-width: 350px;
			margin: 0;
			font-family: "Playfair Display", Georgia, serif;
			font-size: clamp(36px, 4vw, 49px);
			font-weight: 500;
			line-height: 1.08;
		}

		.story-copy > p:last-child {
			max-width: 320px;
			margin: 18px 0 0;
			color: #f4f0e8d9;
			font-size: 14px;
			line-height: 1.75;
		}

		.form-panel {
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 56px clamp(36px, 7vw, 82px);
		}

		.form-content { width: 100%; max-width: 360px; }

		.form-content h2 {
			margin: 0;
			font-family: "Playfair Display", Georgia, serif;
			font-size: 34px;
			font-weight: 600;
			letter-spacing: 0;
			line-height: 1.2;
		}

		.intro { margin: 9px 0 34px; color: var(--muted); font-size: 14px; line-height: 1.6; }

		.field { margin-bottom: 20px; }

		label { display: block; margin-bottom: 8px; color: #333d37; font-size: 13px; font-weight: 600; }

		input[type="email"], input[type="password"], input[type="text"] {
			width: 100%;
			height: 48px;
			padding: 0 14px;
			border: 1px solid var(--line);
			border-radius: 3px;
			outline: none;
			background: #fff;
			color: var(--ink);
			font: inherit;
			font-size: 14px;
			transition: border-color 150ms ease, box-shadow 150ms ease;
		}

		input::placeholder { color: #a0a49c; }
		input:focus-visible { border-color: var(--green); box-shadow: 0 0 0 3px #264c3e1c; }

		.password-wrap { position: relative; }
		.password-wrap input { padding-right: 68px; }

		.show-password {
			position: absolute;
			top: 50%;
			right: 12px;
			padding: 5px 2px;
			transform: translateY(-50%);
			border: 0;
			background: transparent;
			color: var(--green);
			cursor: pointer;
			font: inherit;
			font-size: 12px;
			font-weight: 700;
		}

		.show-password:focus-visible, a:focus-visible, button:focus-visible {
			outline: 2px solid var(--coral);
			outline-offset: 3px;
		}

		.form-options {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			margin: 2px 0 25px;
			font-size: 12px;
		}

		.remember { display: inline-flex; align-items: center; gap: 8px; color: #59625b; cursor: pointer; }
		.remember input { width: 15px; height: 15px; margin: 0; accent-color: var(--green); }
		a { color: var(--green); font-weight: 600; text-decoration-thickness: 1px; text-underline-offset: 3px; }
		.form-options a { white-space: nowrap; }

		.submit-button {
			width: 100%;
			min-height: 49px;
			border: 1px solid var(--green);
			border-radius: 3px;
			background: var(--green);
			color: white;
			cursor: pointer;
			font: inherit;
			font-size: 14px;
			font-weight: 700;
			transition: background 150ms ease, transform 150ms ease;
		}

		.submit-button:hover { transform: translateY(-1px); background: #1e3e32; }
		.submit-button:active { transform: translateY(0); }

		.form-message { min-height: 20px; margin: 12px 0 0; color: #a34d3b; font-size: 12px; line-height: 1.5; }
		.divider { display: flex; align-items: center; gap: 14px; margin: 21px 0; color: #969b93; font-size: 11px; }
		.divider::before, .divider::after { height: 1px; flex: 1; background: #e7e7e0; content: ""; }
		.create-account { margin: 0; color: var(--muted); text-align: center; font-size: 13px; }
		.create-account a { margin-left: 3px; }

		@keyframes arrive {
			from { opacity: 0; transform: translateY(9px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
		}

		@media (max-width: 760px) {
			body { padding: 18px; }
			.login-shell { grid-template-columns: 1fr; max-width: 520px; min-height: auto; }
			.story { min-height: 245px; padding: 24px 28px; }
			.story-copy { padding: 38px 0 0; }
			.story h1 { max-width: 390px; font-size: 36px; }
			.story-copy > p:last-child { display: none; }
			.eyebrow { margin-bottom: 10px; }
			.form-panel { padding: 38px 28px 42px; }
			.intro { margin-bottom: 26px; }
		}

		@media (max-width: 380px) {
			body { padding: 10px; }
			.story { min-height: 220px; padding: 20px; }
			.form-panel { padding: 32px 20px; }
			.form-options { align-items: flex-start; }
		}
	</style>
</head>
<body>
	<main class="login-shell">
		<section class="story" aria-label="Welcome to Fieldnote">
			<a class="brand" href="#" aria-label="Fieldnote home">
				<span class="brand-mark" aria-hidden="true">f</span>
				<span>fieldnote</span>
			</a>
			<div class="story-copy">
				<p class="eyebrow">A little room to grow</p>
				<h1>Make space for what matters.</h1>
				<p>Your ideas, plans, and everyday progress, all in one thoughtful place.</p>
			</div>
		</section>

		<section class="form-panel" aria-labelledby="login-heading">
			<div class="form-content">
				<h2 id="login-heading">Welcome back</h2>
				<p class="intro">Sign in to pick up where you left off.</p>

				<form id="login-form">
					<div class="field">
						<label for="email">Email address</label>
						<input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="username" required>
					</div>

					<div class="field">
						<label for="password">Password</label>
						<div class="password-wrap">
							<input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
							<button class="show-password" id="toggle-password" type="button" aria-controls="password" aria-pressed="false">Show</button>
						</div>
					</div>

					<div class="form-options">
						<label class="remember" for="remember">
							<input id="remember" name="remember" type="checkbox">
							<span>Remember me</span>
						</label>
						<a href="mailto:support@fieldnote.example?subject=Password%20help">Forgot password?</a>
					</div>

					<button class="submit-button" type="submit">Sign in</button>
					<p class="form-message" id="form-message" role="status" aria-live="polite"></p>
				</form>

				<div class="divider" aria-hidden="true">OR</div>
				<p class="create-account">New to Fieldnote? <a href="mailto:support@fieldnote.example?subject=Create%20an%20account">Create an account</a></p>
			</div>
		</section>
	</main>

	<script>
		const passwordInput = document.querySelector("#password");
		const passwordToggle = document.querySelector("#toggle-password");
		const loginForm = document.querySelector("#login-form");
		const formMessage = document.querySelector("#form-message");

		passwordToggle.addEventListener("click", () => {
			const isVisible = passwordInput.type === "text";
			passwordInput.type = isVisible ? "password" : "text";
			passwordToggle.textContent = isVisible ? "Show" : "Hide";
			passwordToggle.setAttribute("aria-pressed", String(!isVisible));
		});

		loginForm.addEventListener("submit", (event) => {
			event.preventDefault();
			formMessage.textContent = "Sign-in is not connected yet. Please configure an authentication service.";
		});
	</script>
</body>
</html>
